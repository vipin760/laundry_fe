workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        certificates:
          - laundrybrew_distribution_p12
        provisioning_profiles:
          - Laundrybrew App Store
      groups:
        - ios_secrets
      vars:
        APP_STORE_APPLE_ID: "6799244954"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set Google Maps iOS key
        script: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY is not set in Codemagic group ios_secrets"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :GMSApiKey $GOOGLE_MAPS_API_KEY" ios/Runner/Info.plist
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          pod install --project-directory=ios
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
        ignore_failure: true
      - name: Flutter unit tests
        script: |
          flutter test
      - name: Flutter build ipa
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
